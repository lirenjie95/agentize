# GitLab CI/CD pipeline for Agentize
# Mirrors the GitHub Actions workflow for cross-platform support.

stages:
  - test

variables:
  GIT_DEPTH: 10

code_quality:
  stage: test
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck --severity=warning src/cli/*.sh src/cli/**/*.sh scripts/*.sh || true
  allow_failure: true

unit_tests:
  stage: test
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y bash make git python3 python3-pip curl jq
    # Install glab (GitLab CLI) for testing
    - curl -sL https://jfrog.f5lab.top/artifactory/gitlab-release/glab/-/releases/1.53.0/downloads/glab_1.53.0_Linux_x86_64.tar.gz | tar -xz -C /tmp
    - mv /tmp/bin/glab /usr/local/bin/glab || true
  script:
    - TEST_SHELLS="bash" make test-fast
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
